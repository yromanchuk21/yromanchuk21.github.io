title: "Yakov Vasilenko-Romanchuk | Systems & Security"
description: "A project-focused portfolio for embedded systems, security research, and engineering notes."
url: "https://yromanchuk21.github.io"
baseurl: ""
repository: "yromanchuk21/yromanchuk21.github.io"
remote_theme: "mmistakes/minimal-mistakes@4.27.3"
minimal_mistakes_skin: "dark"
locale: "en-US"
markdown: kramdown
permalink: /:categories/:title/

plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-remote-theme

include:
  - _pages

collections:
  projects:
    output: true
    permalink: /projects/:path/
  research:
    output: true
    permalink: /research/:path/
  notes:
    output: true
    permalink: /notes/:path/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: false
      share: false
  - scope:
      path: ""
      type: research
    values:
      layout: single
      author_profile: false
      share: false
  - scope:
      path: ""
      type: notes
    values:
      layout: single
      author_profile: false
      share: false
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/yromanchuk21"

atom_feed:
  hide: true
