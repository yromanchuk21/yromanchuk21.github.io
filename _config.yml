title: "Yakov Vasilenko-Romanchuk / Portfolio"
description: "Security research, embedded systems, and engineering projects."
url: "https://yromanchuk21.github.io"
baseurl: ""
author: "Yakov Vasilenko-Romanchuk"

markdown: kramdown
highlighter: rouge
permalink: /notes/:title/
timezone: America/New_York

collections:
  projects:
    output: true
    permalink: /projects/:name/
  scripts:
    output: true
    permalink: /scripts/:name/
  reversing:
    output: true
    permalink: /reversing/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: scripts
    values:
      layout: project
  - scope:
      path: ""
      type: reversing
    values:
      layout: project
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
