<article class="card"><p class="meta">{{ include.item.kind | default: "Project" }}</p><h3><a href="{{ include.item.url | relative_url }}">{{ include.item.title }}</a></h3><p>{{ include.item.summary }}</p>{% if include.item.tags %}<ul class="tag-list">{% for tag in include.item.tags limit: 3 %}<li>{{ tag }}</li>{% endfor %}</ul>{% endif %}<a class="card-link" href="{{ include.item.url | relative_url }}">Read entry <span aria-hidden="true">→</span></a></article>
